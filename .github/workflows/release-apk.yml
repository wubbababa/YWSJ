name: Release APK

# Builds the APK and publishes it to GitHub Releases:
#   * push to main/master -> replaces the rolling "apk-latest" release
#   * push of a v* tag    -> creates the release for that tag
#   * manual run          -> same as a branch push
on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  workflow_dispatch:

# Required for the default GITHUB_TOKEN to create releases.
permissions:
  contents: write

concurrency:
  group: release-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Build and publish APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Set up Gradle with Specific Version
      uses: gradle/actions/setup-gradle@v4
      with:
        # AGP 9.3.x requires Gradle 9.5.0.
        gradle-version: 9.5.0

    # AGP signs debug builds with ~/.android/debug.keystore. A fresh runner
    # would otherwise generate a throwaway key on every build, and an APK signed
    # with a different key cannot be installed over an earlier one.
    - name: Restore a stable debug keystore
      env:
        DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
      run: |
        set -euo pipefail
        mkdir -p "$HOME/.android"
        if [ -n "${DEBUG_KEYSTORE_BASE64:-}" ]; then
          printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 -d > "$HOME/.android/debug.keystore"
          echo "Restored the debug keystore from the DEBUG_KEYSTORE_BASE64 secret."
        elif [ -f debug.keystore.base64 ]; then
          tr -d '\r\n' < debug.keystore.base64 | base64 -d > "$HOME/.android/debug.keystore"
          echo "Restored the debug keystore from debug.keystore.base64."
        else
          echo "::warning::No stable debug keystore found (DEBUG_KEYSTORE_BASE64 secret or debug.keystore.base64). A new debug key is generated for this build, so users must uninstall the previous build before installing this APK."
          keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" \
            -storepass android -keypass android -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
        fi

    # A signed release APK is published when the upload keystore secrets are
    # configured; otherwise the installable debug APK is published.
    - name: Build APK
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        set -euo pipefail
        if [ -n "${KEYSTORE_BASE64:-}" ]; then
          # app/build.gradle.kts reads KEYSTORE_PATH (defaults to
          # <rootDir>/my-upload-key.jks) plus STORE_PASSWORD and KEY_PASSWORD.
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/my-upload-key.jks"
          echo "Building the signed release APK."
          gradle :app:assembleRelease
          echo "APK_PATH=app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_ENV"
          echo "APK_VARIANT=release" >> "$GITHUB_ENV"
        else
          echo "Building the debug APK (no release keystore secrets configured)."
          gradle :app:assembleDebug
          echo "APK_PATH=app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_ENV"
          echo "APK_VARIANT=debug" >> "$GITHUB_ENV"
        fi

    - name: Collect the APK and the release metadata
      id: meta
      run: |
        set -euo pipefail
        VERSION=$(sed -n 's/.*versionName[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n1)
        VERSION="${VERSION:-0.0.0}"
        mkdir -p dist
        if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
          ASSET="dontplayphone-${GITHUB_REF_NAME}.apk"
          TAG="${GITHUB_REF_NAME}"
          TITLE="又玩手机 ${GITHUB_REF_NAME}"
        else
          # Stable asset name so the download URL of the rolling release never
          # changes between builds.
          ASSET="dontplayphone-latest.apk"
          TAG="apk-latest"
          TITLE="又玩手机 最新构建 (v${VERSION} · build ${GITHUB_RUN_NUMBER})"
        fi
        cp "$APK_PATH" "dist/$ASSET"
        {
          echo "version=$VERSION"
          echo "asset=$ASSET"
          echo "tag=$TAG"
          echo "title=$TITLE"
        } >> "$GITHUB_OUTPUT"
        ls -lh dist

    - name: Upload the APK as a workflow artifact
      uses: actions/upload-artifact@v4
      with:
        name: apk-${{ steps.meta.outputs.version }}-${{ github.run_number }}
        path: dist/*.apk
        if-no-files-found: error

    - name: Publish the GitHub release
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ steps.meta.outputs.tag }}
        TITLE: ${{ steps.meta.outputs.title }}
        ASSET: ${{ steps.meta.outputs.asset }}
        VERSION: ${{ steps.meta.outputs.version }}
      run: |
        set -euo pipefail
        NOTES=$(cat <<EOF
        由 GitHub Actions 自动构建并发布。

        - 版本：v${VERSION}
        - 构建类型：${APK_VARIANT}
        - 提交：${GITHUB_SHA}
        - 运行序号：${GITHUB_RUN_NUMBER}

        安装后请在应用内授予「悬浮窗」与「后台运行」权限，否则系统会静默拦截提醒弹窗。
        EOF
        )
        if ! gh release view "$TAG" >/dev/null 2>&1; then
          gh release create "$TAG" --title "$TITLE" --notes "$NOTES" --latest
        fi
        # Upload before refreshing the metadata: the asset is the deliverable, so
        # it must never be skipped because a later cosmetic call failed.
        gh release upload "$TAG" "dist/$ASSET" --clobber
        gh release edit "$TAG" --title "$TITLE" --notes "$NOTES" --latest
        echo "Published $ASSET to the $TAG release."
